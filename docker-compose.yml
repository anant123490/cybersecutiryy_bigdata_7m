services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: cybershield-namenode
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      CLUSTER_NAME: cybershield
    env_file:
      - hadoop.env

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: cybershield-datanode
    restart: unless-stopped
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - hadoop.env

  mongodb:
    image: mongo:7.0
    container_name: cybershield-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  app:
    build: .
    container_name: cybershield-app
    restart: unless-stopped
    depends_on:
      - namenode
      - datanode
      - mongodb
    ports:
      - "8501:8501"
    volumes:
      - .:/workspace
    environment:
      HDFS_INPUT: hdfs://namenode:9000/user/cybershield/raw/*.csv
      HDFS_OUTPUT: hdfs://namenode:9000/user/cybershield/processed/latest
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: CyberShield
      LOCAL_OUTPUT_DIR: /workspace/data/processed
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hadoop_namenode:
  hadoop_datanode:
  mongodb_data:
